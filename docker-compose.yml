version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tradesimulator
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d tradesimulator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: